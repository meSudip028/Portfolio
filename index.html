const engine=(dl=0)=>{try{if(P.engineSound){new Audio(P.engineSound).play().catch(()=>{});return}unlock();const t=ctx.currentTime+dl+.03,D=2.5,C=ctx.createDynamicsCompressor(),M=ctx.createGain();M.gain.value=.6;M.connect(C).connect(ctx.destination);MG=M;
const voice=(f0,pass,dir,vol)=>{const g=ctx.createGain(),lp=ctx.createBiquadFilter(),pn=ctx.createStereoPanner?ctx.createStereoPanner():null;lp.type="lowpass";lp.Q.value=1.2;lp.frequency.setValueAtTime(1500,t);lp.frequency.linearRampToValueAtTime(6000,t+pass);lp.frequency.linearRampToValueAtTime(1800,t+D);
g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+pass);g.gain.exponentialRampToValueAtTime(.0001,t+D);
[[1,"sawtooth",.3],[2,"square",.1],[3,"sawtooth",.08],[.5,"triangle",.22]].forEach(([m,ty,a])=>{const o=ctx.createOscillator(),og=ctx.createGain(),F=o.frequency;o.type=ty;og.gain.value=a;F.setValueAtTime(f0*1.1*m,t);F.exponentialRampToValueAtTime(f0*1.6*m,t+pass-.03);F.exponentialRampToValueAtTime(f0*m,t+pass+.1);F.exponentialRampToValueAtTime(f0*1.35*m,t+D);o.connect(og).connect(lp);o.start(t);o.stop(t+D+.1)});
lp.connect(g);if(pn){pn.pan.setValueAtTime(-dir*.9,t);pn.pan.linearRampToValueAtTime(dir*.9,t+D);g.connect(pn).connect(M)}else g.connect(M)};
voice(300,1.05,1,.55);voice(268,1.1,-1,.55);
const n=ctx.createBuffer(1,ctx.sampleRate*D|0,ctx.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
const s=ctx.createBufferSource(),bp=ctx.createBiquadFilter(),ng=ctx.createGain();s.buffer=n;bp.type="bandpass";bp.Q.value=.7;bp.frequency.setValueAtTime(800,t);bp.frequency.exponentialRampToValueAtTime(2600,t+1.1);bp.frequency.exponentialRampToValueAtTime(700,t+D);ng.gain.setValueAtTime(.0001,t);ng.gain.exponentialRampToValueAtTime(.2,t+1.1);ng.gain.exponentialRampToValueAtTime(.0001,t+D);s.connect(bp).connect(ng).connect(M);s.start(t)
}catch(e){}};
